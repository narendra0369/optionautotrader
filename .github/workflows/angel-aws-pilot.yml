name: OptionX Angel AWS SSH-only pilot safety

on:
  push:
    branches:
      - optionx-angel-aws-pilot-20261124
    paths:
      - 'ops/**'
      - 'market_api.py'
      - 'live_gateway.py'
      - 'angel_gateway.py'
      - 'live_v7/**'
      - 'test_market_api.py'
      - '.github/workflows/angel-aws-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OPTIONX_LIVE_ORDERS_ENABLED: "0"
      OPTIONX_REAL_ORDERS_ENABLED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile read-only AWS pilot
        run: python3 -m compileall -q ops/angel_ssh_readonly_pilot.py ops/test_angel_ssh_readonly_pilot.py ops/paper_ledger_v1.py ops/test_paper_ledger_v1.py ops/optionx_batch_gatecheck.py ops/test_optionx_batch_gatecheck.py ops/angel_paper_foreground_monitor.py ops/test_angel_paper_foreground_monitor.py ops/private_paper_dashboard.py ops/paper_recovery_audit.py ops/test_private_dashboard_recovery.py ops/synthetic_live_lifecycle_matrix.py ops/test_synthetic_live_lifecycle_matrix.py ops/optionx_release_gate_matrix.py ops/test_optionx_release_gate_matrix.py live_gateway.py angel_gateway.py live_v7
      - name: Existing API and no-orders regression suite
        run: python3 -m unittest -q live_v7.test_future_safety test_market_api
      - name: AWS static IP and Angel SSH pilot tests (fully mocked)
        run: python3 -m unittest -q ops.test_verify_angel_aws_readiness ops.test_angel_ssh_readonly_pilot ops.test_paper_ledger_v1 ops.test_optionx_batch_gatecheck ops.test_angel_paper_foreground_monitor ops.test_private_dashboard_recovery ops.test_synthetic_live_lifecycle_matrix ops.test_optionx_release_gate_matrix
      - name: Combined AWS full offline gate suites (broker calls always mocked)
        run: python3 -m unittest -q live_v7.test_future_safety test_market_api test_angel_gateway test_live_gateway live_v7.test_angel_marketdata live_v7.test_angel_readonly_http live_v7.test_angel_snapshot_contract live_v7.test_extended_offline ops.test_verify_angel_aws_readiness ops.test_angel_ssh_readonly_pilot ops.test_paper_ledger_v1 ops.test_optionx_batch_gatecheck ops.test_angel_paper_foreground_monitor ops.test_private_dashboard_recovery ops.test_synthetic_live_lifecycle_matrix ops.test_optionx_release_gate_matrix
      - name: Refuse real-order activation
        run: |
          python3 - <<'PY'
          from live_gateway import hard_block_order
          assert hard_block_order()["error"] == "REAL_ORDERS_HARD_LOCKED"
          assert hard_block_order()["orderSent"] is False
          print("PASS: live real orders remain hard locked")
          PY
