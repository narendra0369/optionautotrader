name: OPTIONX V87 Offline Safety Tests
on:
  push:
    branches:
      - optionx-v87-angel-reconcile-readonly-20261127
  pull_request:
    branches:
      - optionx-v86-stop-recovery-certification-prep-20261126
permissions:
  contents: read
jobs:
  v87-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify read-only no-broker safety model
        run: |
          python -m unittest discover -s tests -p 'test_optionx_v87_angel_reconcile.py' -v
