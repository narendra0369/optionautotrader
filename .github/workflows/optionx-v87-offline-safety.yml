name: OPTIONX V87-V91 Offline Safety Tests
on:
  push:
    branches:
      - optionx-v87-angel-reconcile-readonly-20261127
  pull_request:
    branches:
      - optionx-v86-stop-recovery-certification-prep-20261126
permissions:
  contents: read
jobs:
  offline-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify safe reconciliation exposure and SL preflight
        run: |
          python -m unittest discover -s tests -p 'test_optionx_v87_angel_reconcile.py' -v
          python -m unittest discover -s tests -p 'test_optionx_v88_live_preflight.py' -v
          python -m unittest discover -s tests -p 'test_optionx_v89_angel_exposure_inspect.py' -v
          python -m unittest discover -s tests -p 'test_optionx_v90_fill_sl_ownership_review.py' -v
          python -m unittest discover -s tests -p 'test_optionx_v91_manual_sl_preflight.py' -v
